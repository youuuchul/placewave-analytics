[project]
name = "placewave-analytics"
version = "0.1.0"
description = "합성 GA4 형태 로그와 원장으로 재현한 KPI 파이프라인 포트폴리오 (실제 서비스 데이터 아님)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]
ml = [
    "lightgbm>=4.7.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
